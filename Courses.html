<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exebridge Academy</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="CoursesStyle.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img
          src="Assets/Imgs/Logo2.png"
          alt="Logo"
          width="70"
          height="70"
          class="d-inline-block align-text-top"
        />
      </a>
      <p class="navbar-brand">Exebridge Academy</p>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
        >
        <span class="navbar-toggler-icon"></span>
        </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="HomePage.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="Courses.html">Courses</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Recipes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contacts</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Layout: Sidebar + Main Content -->
  <div class="d-flex mt-4">
    <!-- Sidebar for large devices -->
    <div class="sidebar-lg d-none d-lg-block">
      <h5>Courses Filter</h5>
      <div id="filterContentDesktop"></div>
    </div>

    <!-- Main content -->
    <div class="flex-grow-1 px-3">
      <!-- Mobile filter button -->
      <div class="center d-lg-none mb-3">
        <button
          type="button"
          class="btn btn-danger"
          data-bs-toggle="offcanvas"
          data-bs-target="#filterOffcanvas"
        >
          Courses Filter
        </button>
      </div>

      <!-- Course cards -->
      <div class="row" id="courseContainer"></div>
    </div>
  </div>

  <!-- Offcanvas filter for mobile -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="filterOffcanvas">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Courses Filter</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div id="filterContentMobile"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="Scripts/Courses.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</body>
</html>
